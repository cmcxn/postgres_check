spring:
  application:
    name: postgres-check
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/your_database
    username: your_username
    password: your_password
    driver-class-name: org.postgresql.Driver
  
  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  
  # 邮件配置
  mail:
    host: smtp.example.com
    port: 587
    username: your_email@example.com
    password: your_email_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 应用自定义配置
app:
  # 监控配置
  monitor:
    # 检查间隔（cron表达式，默认每5分钟执行一次）
    cron: "0 */5 * * * ?"
    # 数据时间窗口（分钟），检查最近N分钟内是否有新数据
    time-window-minutes: 5
    # 表名
    table-name: sync_operation_log
  
  # 邮件通知配置
  notification:
    # 启用邮件通知
    enabled: true
    # 发件人
    from: your_email@example.com
    # 收件人列表（多个收件人用逗号分隔）
    to: recipient@example.com
    # 邮件主题
    subject: "[警告] 数据库监控：sync_operation_log 表无新数据"
    # 邮件内容模板
    body-template: |
      您好，
      
      数据库监控系统检测到 sync_operation_log 表在过去 %d 分钟内没有新增数据。
      
      检测时间：%s
      表名：%s
      时间窗口：最近 %d 分钟
      
      请及时检查数据同步服务是否正常运行。
      
      此邮件由系统自动发送，请勿回复。

# 日志配置
logging:
  level:
    com.database.postgrescheck: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/postgres-check.log
    max-size: 10MB
    max-history: 30
